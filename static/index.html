<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>門市原廠進貨查詢</title>
  <link rel="stylesheet" href="styles.css?v=20260610a">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Inventory · 進貨</div>
        <h1>門市原廠進貨查詢</h1>
      </div>
      <div class="topbar-actions">
        <a class="ghost-btn" href="transfer.html" style="text-decoration:none">門市調撥工具 →</a>
      </div>
    </header>

    <section class="module-view" id="purchaseModule">
      <section class="inventory-filter-panel">
        <div class="field store-field">
          <label for="storeId1">我方倉</label>
          <select id="storeId1"></select>
        </div>
        <div class="field">
          <label for="startDate">起始日</label>
          <input id="startDate" type="date">
        </div>
        <div class="field">
          <label for="endDate">結束日</label>
          <input id="endDate" type="date">
        </div>
        <div class="inventory-actions">
          <button id="clearBtn" class="ghost-btn" type="button">清除</button>
          <button id="downloadBtn" class="ghost-btn" type="button">下載 Excel</button>
          <button id="searchBtn" class="primary-btn" type="button">查詢進貨</button>
        </div>
        <p id="message" class="inventory-message">固定條件：調撥入庫 INVTRNIN｜來源倉 SA099 總公司倉｜APL主機（類別1 含 1003/1001、類別2 = 2001、類別3 = 3001）</p>
      </section>

      <section class="inventory-result-panel">
        <div class="result-heading">
          <h2>查詢結果</h2>
          <div class="result-heading-right">
            <span id="resultCount">0 筆</span>
            <button id="labelBtn" class="ghost-btn" type="button" disabled>產生標籤</button>
          </div>
        </div>
        <div class="inventory-table-wrap">
          <table class="inventory-table">
            <thead>
              <tr>
                <th>單據日期</th>
                <th>來源單據代碼</th>
                <th>品牌代碼</th>
                <th>存貨代碼</th>
                <th>型號</th>
                <th>存貨名稱</th>
                <th>存貨數量</th>
                <th>來源倉</th>
              </tr>
            </thead>
            <tbody id="resultBody">
              <tr><td colspan="8" class="empty">輸入條件後按「查詢進貨」。</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="labelPanel" class="label-panel hidden">
      <div class="label-panel-header">
        <div class="label-panel-title">
          <h2>標籤預覽</h2>
          <span id="labelCount"></span>
        </div>
        <div class="label-panel-controls">
          <label class="label-control-item">起始格 <input id="labelStartPos" type="number" min="1" max="95" value="1" class="label-num-input"></label>
          <label class="label-control-item">週數 <input id="labelWeekInput" type="text" value="" placeholder="W20" class="label-week-input"></label>
          <label class="label-control-item label-checkbox"><input id="labelBorder" type="checkbox"> 框線</label>
          <button id="layoutToggleBtn" class="ghost-btn lp-toggle-btn" type="button">排版調整 ▾</button>
          <button id="printBtn" class="primary-btn" type="button">列印</button>
          <button id="closeLabelBtn" class="ghost-btn" type="button">關閉</button>
        </div>
      </div>

      <div id="layoutPanel" class="lp-panel lp-collapsed">
        <div class="lp-row">
          <div class="lp-row-title">列印位置</div>
          <div class="lp-row-fields">
            <label class="lp-field"><span>水平偏移 mm</span><input type="number" id="lpOffsetX" value="0" min="-20" max="20" step="0.5"></label>
            <label class="lp-field"><span>垂直偏移 mm</span><input type="number" id="lpOffsetY" value="7" min="-10" max="30" step="0.5"></label>
          </div>
        </div>
        <div class="lp-row">
          <div class="lp-row-title">文字位置</div>
          <div class="lp-row-fields">
            <label class="lp-field"><span>左側位置 mm</span><input type="number" id="lpLeftPad" value="5" min="0" max="15" step="0.5"></label>
            <label class="lp-field"><span>右側位置 mm</span><input type="number" id="lpRightPad" value="6" min="0" max="15" step="0.5"></label>
            <label class="lp-field"><span>第一行上距 mm</span><input type="number" id="lpFirstTop" value="2" min="0" max="8" step="0.5"></label>
            <label class="lp-field"><span>內容整體下移 mm</span><input type="number" id="lpContentTop" value="2" min="0" max="8" step="0.5"></label>
          </div>
        </div>
        <div class="lp-row">
          <div class="lp-row-title">字級</div>
          <div class="lp-row-fields">
            <label class="lp-field"><span>第一行 pt</span><input type="number" id="lpFont1" value="10" min="6" max="16" step="0.5"></label>
            <label class="lp-field"><span>第二行 pt</span><input type="number" id="lpFont2" value="10" min="6" max="16" step="0.5"></label>
            <label class="lp-field"><span>週數 pt</span><input type="number" id="lpWeekFont" value="5" min="3" max="10" step="0.5"></label>
            <label class="lp-field"><span>週數上距 mm</span><input type="number" id="lpWeekTop" value="1" min="0" max="8" step="0.5"></label>
            <label class="lp-field"><span>週數右距 mm</span><input type="number" id="lpWeekRight" value="1.5" min="0" max="8" step="0.5"></label>
          </div>
        </div>
        <div class="lp-row">
          <div class="lp-row-title">905 浮水印</div>
          <div class="lp-row-fields">
            <label class="lp-field"><span>字級 pt</span><input type="number" id="lpWmSize" value="13" min="5" max="24" step="0.5"></label>
            <label class="lp-field"><span>透明度</span><input type="number" id="lpWmOpacity" value="0.35" min="0.05" max="1" step="0.05"></label>
            <label class="lp-field"><span>水平 %</span><input type="number" id="lpWmX" value="50" min="0" max="100" step="5"></label>
            <label class="lp-field"><span>垂直 %</span><input type="number" id="lpWmY" value="50" min="0" max="100" step="5"></label>
          </div>
        </div>
        <div class="lp-actions">
          <button id="lpResetBtn" class="ghost-btn" type="button">恢復預設</button>
        </div>
      </div>

      <div class="label-sheet-wrap">
        <div id="labelPrintArea">
          <div class="label-sheet" id="labelSheet"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="label-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
